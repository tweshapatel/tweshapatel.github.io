<style>
body{margin:0}
*{box-sizing:border-box}
.root{background:#e6e1d8;color:#1a1a1a;font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#1a1a1a}a:hover{color:#c4311d}
.h{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:400;letter-spacing:-.04em;line-height:.9;margin:0}
.red{color:#e0402a}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#57524a;margin:0;font-weight:500}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(20px,4vw,56px)}
/* nav */
.nav{position:sticky;top:0;z-index:5;background:rgba(230,225,216,.94);backdrop-filter:blur(6px);border-bottom:1px solid rgba(26,26,26,.18)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:64px}
.brand{font-family:'Archivo Black',sans-serif;font-size:18px;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand .d{width:12px;height:12px;border-radius:50%;background:#e0402a;display:inline-block}
.links{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.links a{text-decoration:none;font-size:14px;font-weight:500;padding:12px 12px;border-radius:999px}
.links a:hover{background:rgba(26,26,26,.06);color:#1a1a1a}
.links a.cta{background:#1a1a1a;color:#e6e1d8;padding:12px 18px}
.links a.cta:hover{background:#c4311d;color:#fff}
/* hero */
.title{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin:0}
.name{font-size:clamp(64px,8.6vw,132px);letter-spacing:-.05em}
.punch{font-family:'Archivo Black',sans-serif;font-weight:400;letter-spacing:-.03em;line-height:1.02;color:#e0402a;margin:0}
.sub{font-size:18px;line-height:1.45;max-width:46ch;margin:0}
.known{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #1a1a1a;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500}
.chip.f{background:#1a1a1a;color:#e6e1d8}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;background:#c4311d;color:#fff;text-decoration:none;font-weight:600;font-size:15px;border:1.5px solid #c4311d;font-family:inherit;cursor:pointer;transition:transform .25s}
.btn:hover{transform:translateY(-2px);color:#fff}
.btn.o{background:transparent;color:#1a1a1a;border-color:#1a1a1a}
.btn.o:hover{color:#1a1a1a}
.ph{background:#c2bcb1;color:#3d3a35;display:flex;align-items:flex-end;padding:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.35;position:relative}
.portrait{aspect-ratio:4/5;width:100%}
.pwrap{position:relative}
.pwrap .dot{position:absolute;width:96px;height:96px;border-radius:50%;background:#e0402a;top:-36px;left:-36px;animation:pop .9s cubic-bezier(.3,1.5,.5,1) .3s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.r2{animation-delay:.1s}.r3{animation-delay:.2s}.r4{animation-delay:.3s}
.loc{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.loc svg{flex:none}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1.5px solid #1a1a1a}
.st{padding:20px 20px 4px 0}
.st + .st{padding-left:20px;border-left:1px solid rgba(26,26,26,.2)}
.sn{font-family:'Archivo Black',sans-serif;font-size:clamp(34px,3.6vw,54px);letter-spacing:-.03em;line-height:1}
.sl{font-size:13px;color:#57524a;margin-top:8px;max-width:24ch}
/* caps accordion (A) */
.caps{border-top:1.5px solid #1a1a1a}
.cap{border-bottom:1px solid rgba(26,26,26,.2)}
.cap-b{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:56px minmax(0,1.1fr) minmax(0,1fr) 44px;gap:16px;align-items:center;padding:20px 0;min-height:44px}
.cap-b:focus-visible{outline:2px solid #e0402a;outline-offset:4px}
.cap-n{font-family:'Archivo Black',sans-serif;color:#e0402a;font-size:18px}
.cap-t{font-family:'Archivo Black',sans-serif;font-size:clamp(28px,3.4vw,48px);letter-spacing:-.04em;line-height:1;transition:color .2s}
.cap-b:hover .cap-t{color:#e0402a}
.cap-h{font-size:16px;font-weight:500}
.pm{width:40px;height:40px;border-radius:50%;border:1.5px solid #1a1a1a;display:flex;align-items:center;justify-content:center;transition:transform .3s,background .2s,color .2s}
.cap.on .pm{transform:rotate(45deg);background:#1a1a1a;color:#e6e1d8}
.cap-d{display:grid;grid-template-columns:56px minmax(0,1.1fr) minmax(0,1fr) 44px;gap:16px;padding:0 0 28px;animation:rise .45s ease both}
.ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ul li{padding-left:22px;position:relative;font-size:15px;max-width:60ch}
.ul li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:#e0402a}
.bigstat{font-family:'Archivo Black',sans-serif;font-size:clamp(44px,4.6vw,72px);letter-spacing:-.03em;line-height:1}
/* section heads */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.sh .h{font-size:clamp(44px,5.6vw,88px);color:#e0402a}
/* roles */
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1.5px solid #1a1a1a}
.role{position:relative;padding:22px 22px 0 0}
.role + .role{padding-left:22px;border-left:1px solid rgba(26,26,26,.2)}
.role-b{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;min-height:44px}
.role-b:focus-visible{outline:2px solid #e0402a;outline-offset:4px}
.yr{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:-.03em}
.rt{font-weight:600;font-size:15px;margin:8px 0 2px;line-height:1.3}
.ro{font-size:13px;color:#57524a;margin:0}
.more{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:12px;border-bottom:1.5px solid #1a1a1a;padding-bottom:2px}
.role.on .more{color:#c4311d;border-color:#c4311d}
.role-d{padding:14px 0 6px;animation:rise .4s ease both}
.role-d .ul li{font-size:14px}
.edu{font-size:13px;color:#57524a;display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
/* off duty */
.off{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr) minmax(0,.9fr);gap:28px;align-items:start}
.barfi{aspect-ratio:1/1;width:100%;border-radius:50%}
.stage{aspect-ratio:4/3;width:100%;background:#1a1a1a;color:#b8b2a7;display:flex;align-items:flex-end;justify-content:space-between;padding:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.stage-nav{display:flex;gap:8px}
.ib{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1.5px solid #e6e1d8;color:#e6e1d8;display:flex;align-items:center;justify-content:center}
.ib:focus-visible{outline:2px solid #e0402a}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}
.thumb{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1/1;background:#c2bcb1;outline:0 solid #e0402a;transition:outline-width .15s;min-height:44px}
.thumb.on{outline-width:3px;outline-offset:-3px}
.thumb:focus-visible{outline:2px solid #1a1a1a;outline-offset:2px}
.offlist{list-style:none;margin:0;padding:0;border-top:1.5px solid #1a1a1a}
.offlist li{padding:14px 0;border-bottom:1px solid rgba(26,26,26,.2)}
.offlist b{display:block;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:20px;letter-spacing:-.02em;line-height:1.1}
.offlist span{font-size:14px;color:#57524a}
/* contact */
.talk{background:#1a1a1a;color:#e6e1d8}
.talk a{color:#e6e1d8}
.talk .lbl{color:#b8b2a7}
.talk .btn.o{color:#e6e1d8;border-color:#e6e1d8}
.talk-g{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:56px;align-items:end}
.talk .h{font-size:clamp(56px,7.4vw,118px);color:#e0402a}
.cline{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:17px;padding:12px 0;border-bottom:1px solid rgba(230,225,216,.2)}
.cline a{text-decoration:none;font-weight:600}
.qrbox{display:flex;gap:18px;align-items:center;margin-top:24px}
.qrbox .qr{flex:none;display:block}
.qr{background:#fff;padding:0}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 0 30px;margin-top:72px;border-top:1px solid rgba(230,225,216,.2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b8b2a7}
@media (max-width:900px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .st,.st + .st{padding:16px 0;border-left:0;border-bottom:1px solid rgba(26,26,26,.2)}
 .cap-b,.cap-d{grid-template-columns:40px minmax(0,1fr) 44px}
 .cap-h{grid-column:2}
 .cap-b .pm{grid-row:1;grid-column:3}
 .cap-d > *{grid-column:2 / span 2}
 .roles{grid-template-columns:1fr}
 .role,.role + .role{padding:18px 0;border-left:0;border-bottom:1px solid rgba(26,26,26,.2)}
 .off,.talk-g{grid-template-columns:1fr}
 .links a:not(.cta){display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
html{scroll-behavior:smooth}

.view{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;padding-bottom:64px}
.nav-in{min-height:68px}
.nb{font:inherit;font-size:14px;font-weight:600;background:transparent;border:0;color:#1a1a1a;cursor:pointer;min-height:44px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px}
.nb::before{content:"";width:8px;height:8px;border-radius:50%;background:transparent;transition:background .2s,transform .3s;transform:scale(.4)}
.nb:hover{background:rgba(26,26,26,.06)}
.nb.on::before{background:#e0402a;transform:scale(1)}
.nb:focus-visible{outline:2px solid #e0402a;outline-offset:2px}
.navlinks{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.navlinks a.cta{text-decoration:none;font-size:14px;font-weight:600;padding:12px 18px;border-radius:999px;background:#1a1a1a;color:#e6e1d8;margin-left:8px}
.navlinks a.cta:hover{background:#c4311d;color:#fff}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:56px 0 28px}
.vhead .h{font-size:clamp(52px,6.4vw,104px);color:#e0402a}
.nextbar{display:flex;justify-content:flex-end;padding:40px 0 56px;margin-top:56px;border-top:1px solid rgba(26,26,26,.2)}
.nextbtn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:14px;min-height:44px;font-family:'Archivo Black',sans-serif;font-size:clamp(24px,2.4vw,34px);letter-spacing:-.03em}
.nextbtn small{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#57524a}
.nextbtn:hover{color:#e0402a}
.nextbtn:focus-visible{outline:2px solid #e0402a;outline-offset:4px}
/* home */
.home{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr);gap:64px;align-items:center;padding:64px 0 48px}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#57524a;margin:0}
.lede{font-size:clamp(22px,2.1vw,30px);line-height:1.3;font-weight:500;letter-spacing:-.015em;max-width:27ch;margin:28px 0 14px}
.home .pwrap{justify-self:end;width:min(100%,340px);margin-top:40px}
.home .pwrap .dot{width:132px;height:132px;top:-54px;left:-54px}
.jump{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:28px}
.jb{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid #1a1a1a;padding:18px 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;min-height:64px;transition:background .2s,color .2s}
.jb:hover{background:#1a1a1a;color:#e6e1d8}
.jb:focus-visible{outline:2px solid #e0402a;outline-offset:3px}
.jb span.n{font-family:'Archivo Black',sans-serif;color:#e0402a;font-size:15px}
/* work */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1.5px solid #1a1a1a;padding-bottom:12px}
.tab{font:inherit;font-size:15px;font-weight:600;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #1a1a1a;background:transparent;color:#1a1a1a;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.tab::before{content:"";width:8px;height:8px;border-radius:50%;background:transparent;transition:background .2s}
.tab.on{background:#1a1a1a;color:#e6e1d8}
.tab.on::before{background:#e0402a}
.tab:focus-visible{outline:2px solid #e0402a;outline-offset:3px}
.panel{padding-top:36px;animation:rise .45s ease both}
.p-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:28px}
.p-hook{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:10px 0 0}
@media (max-width:960px){.p-top{grid-template-columns:1fr}}
.tab{text-transform:none !important}
.panel .h{text-transform:none !important}
/* career timeline */
.tl{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-top:34px}
.tl::before{content:"";position:absolute;left:0;right:0;top:12px;height:1.5px;background:#1a1a1a}
.stop{position:relative;display:flex;flex-direction:column;gap:10px}
.stop .pin{position:absolute;top:-30px;left:0;width:17px;height:17px;border-radius:50%;background:#e6e1d8;border:1.5px solid #1a1a1a;transition:transform .3s,background .2s}
.stop.on .pin{background:#e0402a;border-color:#e0402a;transform:scale(1.5)}
.stop .ph{aspect-ratio:4/3;width:100%;filter:grayscale(1);transition:transform .35s}
.stop.on .ph{background:#b3ac9f}
.stop:hover .ph{transform:translateY(-4px)}
.rm{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid #1a1a1a;padding:10px 0 2px;align-self:flex-start;min-height:44px}
.stop.on .rm{color:#c4311d;border-color:#c4311d}
.rm:focus-visible{outline:2px solid #e0402a;outline-offset:3px}
.rdetail{margin-top:28px;background:#1a1a1a;color:#e6e1d8;padding:32px 36px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:36px;animation:rise .4s ease both}
.rdetail .lbl{color:#b8b2a7}
.rdetail .ul li{color:#e6e1d8;font-size:16px}
.rdetail h3{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:clamp(26px,2.6vw,38px);letter-spacing:-.03em;line-height:1.05;margin:10px 0 6px;color:#e0402a}
.proofs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;margin-top:56px;border-top:1.5px solid #1a1a1a;padding-top:24px}
.pf-n{font-family:'Archivo Black',sans-serif;font-size:clamp(38px,4.2vw,64px);letter-spacing:-.03em;line-height:1}
.pf-l{font-size:14px;color:#57524a;margin-top:10px;max-width:28ch}
/* off duty */
.offg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:start}
.spot{background:#1a1a1a;color:#e6e1d8;aspect-ratio:4/5;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:22px;animation:rise .35s ease both}
.spot .cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b8b2a7}
.spot .ttl{font-family:'Archivo Black',sans-serif;font-size:clamp(32px,3.4vw,52px);letter-spacing:-.03em;line-height:1}
.spot .hint{font-size:12px;color:#b8b2a7}
.spot-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.fchip{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #1a1a1a;background:transparent;color:#1a1a1a;cursor:pointer}
.fchip.on{background:#1a1a1a;color:#e6e1d8}
.fchip:focus-visible{outline:2px solid #e0402a;outline-offset:3px}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px;padding:14px 6px 6px;background:#ddd7cc;border:1px solid rgba(26,26,26,.12)}
.pin-card{all:unset;box-sizing:border-box;cursor:pointer;background:#f4f1ea;padding:8px 8px 26px;box-shadow:0 10px 18px -12px rgba(0,0,0,.45);position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1.2),box-shadow .3s;min-height:44px}
.pin-card::before{content:"";position:absolute;top:-8px;left:50%;width:46px;height:16px;margin-left:-23px;background:rgba(224,64,42,.55);transform:rotate(-3deg)}
.pin-card .ph{aspect-ratio:1/1;width:100%;font-size:10px;padding:8px}
.pin-card .pcap{position:absolute;left:10px;bottom:6px;font-size:11px;font-weight:600}
.pin-card.r0{transform:rotate(-3deg)}.pin-card.r1{transform:rotate(2deg) translateY(6px)}.pin-card.r2{transform:rotate(-1deg) translateY(-4px)}.pin-card.r3{transform:rotate(3.5deg)}
.pin-card:hover{transform:rotate(0) translateY(-6px) scale(1.04);box-shadow:0 18px 26px -14px rgba(0,0,0,.5);z-index:2}
.pin-card.on{outline:3px solid #e0402a;outline-offset:2px}
.pin-card:focus-visible{outline:3px solid #1a1a1a;outline-offset:2px}
.off2{display:grid;grid-template-columns:minmax(0,.9fr) repeat(3,minmax(0,1fr));gap:18px;margin-top:48px}
.polaroid{background:#f4f1ea;padding:12px 12px 16px;box-shadow:0 10px 18px -12px rgba(0,0,0,.45);transform:rotate(-2deg)}
.polaroid .ph{aspect-ratio:1/1}
.polaroid p{margin:10px 0 8px;font-family:'Caveat',cursive;font-size:26px;line-height:1}
.patb{font:inherit;font-size:13px;font-weight:600;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #1a1a1a;background:transparent;cursor:pointer}
.patb:hover{background:#1a1a1a;color:#e6e1d8}
.patb:focus-visible{outline:2px solid #e0402a}
.patl{font-size:12px;color:#57524a;margin:8px 0 0;min-height:36px}
.flip{all:unset;box-sizing:border-box;cursor:pointer;perspective:900px;display:block;min-height:220px}
.flip:focus-visible{outline:2px solid #e0402a;outline-offset:3px}
.fi{position:relative;width:100%;height:100%;min-height:220px;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
